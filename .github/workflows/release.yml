# v로 시작하는 태그를 push하면 검증·빌드한 뒤 dist를 zip으로 묶어 GitHub 릴리스에 올린다.
# 이 zip이 그대로 크롬 웹 스토어·웨일 스토어 제출 파일이다.
name: 릴리스

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # 태그와 package.json 버전이 다르면 manifest 버전과 릴리스 이름이 어긋나므로 멈춘다.
      - name: 태그와 버전 일치 확인
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "태그 $GITHUB_REF_NAME 와 package.json 버전 $VERSION 이 다릅니다."
            exit 1
          fi

      - name: 검증
        run: npm run check

      # build는 필터 목록을 새로 받아 다시 변환한다. 릴리스 시점의 최신 목록이 들어간다.
      - name: 빌드
        run: npm run build

      - name: zip 만들기
        run: cd dist && zip -qr "../ma-chiara-${GITHUB_REF_NAME#v}.zip" .

      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ma-chiara-${GITHUB_REF_NAME#v}.zip" --title "마! 치아라 ${GITHUB_REF_NAME#v}" --generate-notes
